version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let a new release age a week before proposing it (supply-chain safety).
    cooldown:
      default-days: 7
    # Major upgrades (Tailwind 4, TypeScript 7, ESLint 10, …) need a deliberate
    # migration, not a bot PR — they are done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
